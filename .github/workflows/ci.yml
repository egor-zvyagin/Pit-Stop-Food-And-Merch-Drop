name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'

      - name: Install Playwright Browser
        working-directory: frontend
        run: npx --yes playwright@$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version") install --with-deps chromium

      # Same script developers run locally: scripts/verify.sh
      - name: Verify
        run: bash scripts/verify.sh
        env:
          CI: true
