name: Deploy Infrastructure (Terraform)

on:
  workflow_dispatch:
    inputs:
      auto_approve:
        description: 'Apply the plan. Leave off to only produce a plan for review.'
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  terraform-deploy:
    name: Terraform Apply (ap-southeast-2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      # The readable plan is kept with the run so it can be reviewed before,
      # or instead of, applying.
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan.txt
          retention-days: 14

      # Applies exactly the plan produced above, and only when asked to.
      - name: Terraform Apply
        if: ${{ inputs.auto_approve }}
        working-directory: infra/terraform
        run: terraform apply -input=false tfplan
